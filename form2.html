<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="from12.css">
</head>

<body>
<form action="#" method="post">

    <div class=" container ">
        <h1><u>Registration Form</u></h1>

        <div class="section">
            <h4>PERSONAL INFORMATION</h4>
            <table>
                <tr>
                    <td>First Name:</td>
                    <td><input type="text"  /></td>
                    <td>Last Name:</td>
                    <td><input type="text" /></td>
                </tr>
                <tr>
                    <td>Caste:</td>
                    <td><input type="text" /></td>
                    <td>Date of birth:</td>
                    <td><input type="date" /></td>
                </tr>
                <tr>
                    <td>Nationality:</td>
                    <td><input type="text" /></td>
                    <td>E-MAIL:</td>
                    <td><input type="email" placeholder="xyz@gmail.com" /></td>
                </tr>
                <tr>
                    <td>Domicile:</td>
                    <td><input type="text" /></td>
                    <td>Gender:</td>
                    <td class="radio-group">
                        <input type="radio" name="sex" value="male" /> Male
                        <input type="radio" name="sex" value="female" /> Female
                    </td>
                </tr>
            </table>
        </div>

        <div class="section1">
    <h4>ADDRESS</h4>

    <div class="row">
        <label>Address:</label>
        <input type="text" id="address">
    </div>

    <div class="row">
        <label>City:</label>
        <input type="text" id="city">
    </div>

    <div class="row">
        <label>District:</label>
        <input type="text" id="district">
    </div>

    <div class="row">
        <label>Pin Code:</label>
        <input type="number" id="pincode">
    </div>
</div>

        <div class="section2">
            <h4>CONTACT</h4>
            <div class="center ">
                <label>Mobile No.:</label>
                <input type="tel " title="mono" />
                <label>WP No.:</label>
                <input type="tel " title="mono"/>
            </div>
        </div>
       </br>
        <div class="center">
            <label>RESET YOUR FORM:</label>
            <input type="reset" value="reste"></input>
            <input class="inputbox1" type="submit" value="Register your data" />
        </div>

    </div>
    
</form>
</body>

</html>
